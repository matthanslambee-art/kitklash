<script src="assets/js/products.js"></script>
<script src="assets/js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  await initProducts();
  const params = new URLSearchParams(location.search);
  const state = {
    league: new Set(),
    team: new Set(),
    era: new Set(),
    sizes: new Set(),
    sort: "newest",
    page: 1,
    perPage: 9
  };
  const initialCategory = params.get("category");
  if (initialCategory === "vintage" || initialCategory === "modern") state.era.add(initialCategory);
  const initialLeague = params.get("league");
  if (initialLeague && LEAGUES.some(l => l.slug === initialLeague)) state.league.add(initialLeague);
  const initialTeam = params.get("team");
  if (initialTeam) state.team.add(initialTeam);

  const titleEl = document.getElementById("shop-title");
  const countEl = document.getElementById("shop-count");
  const gridEl = document.getElementById("shop-grid");
  const chipsEl = document.getElementById("filter-chips");
  const loadMoreBtn = document.getElementById("load-more");
  const sortSelect = document.getElementById("sort-select");

  function currentTeamOptions() {
    return getTeamsForLeagues(Array.from(state.league));
  }

  function renderTeamFilters() {
    const teams = currentTeamOptions();
    // Drop any selected team that's no longer in scope (e.g. its league got unchecked).
    state.team.forEach(t => {
      if (!teams.includes(t)) state.team.delete(t);
    });

    const optionHtml = compact =>
      teams.length
        ? teams
            .map(
              t => `<label class="flex items-center ${compact ? "gap-2" : "gap-4"} cursor-pointer group">
                <input type="checkbox" class="team-check w-4 h-4 accent-white" value="${t}" ${state.team.has(t) ? "checked" : ""}/>
                <span class="font-body-md text-body-md text-on-surface-variant group-hover:text-primary transition-colors ${compact ? "text-sm" : ""}">${t}</span>
              </label>`
            )
            .join("")
        : `<p class="font-label-sm text-label-sm text-outline uppercase tracking-widest">No teams in stock yet</p>`;

    document.getElementById("team-filters").innerHTML = optionHtml(false);
    document.getElementById("team-filters-mobile").innerHTML = optionHtml(true);
  }

  function syncCheckboxes() {
    document.querySelectorAll(".league-check").forEach(cb => (cb.checked = state.league.has(cb.value)));
    document.querySelectorAll(".size-btn").forEach(btn => {
      const on = state.sizes.has(btn.dataset.size);
      btn.classList.toggle("border-primary", on);
      btn.classList.toggle("bg-primary", on);
      btn.classList.toggle("text-pitch-black", on);
      btn.classList.toggle("text-on-surface-variant", !on);
    });
  }

  function getFiltered() {
    let list = PRODUCTS.filter(p => {
      if (state.league.size && !state.league.has(p.league)) return false;
      if (state.team.size && !state.team.has(p.team)) return false;
      if (state.era.size && !state.era.has(p.category)) return false;
      if (state.sizes.size && !p.sizes.some(s => state.sizes.has(s))) return false;
      return true;
    });
    switch (state.sort) {
      case "price_asc": list.sort((a, b) => a.price - b.price); break;
      case "price_desc": list.sort((a, b) => b.price - a.price); break;
      case "year": list.sort((a, b) => a.year - b.year); break;
      default: list.sort((a, b) => b.year - a.year);
    }
    return list;
  }

  function renderChips() {
    const chips = [];
    state.league.forEach(l => chips.push({ label: getLeagueLabel(l), clear: () => state.league.delete(l) }));
    state.team.forEach(t => chips.push({ label: t, clear: () => state.team.delete(t) }));
    state.era.forEach(e =>
      chips.push({ label: e === "vintage" ? "Vintage (Pre-2000)" : "Modern Classics", clear: () => state.era.delete(e) })
    );
    state.sizes.forEach(s => chips.push({ label: "Size: " + s, clear: () => state.sizes.delete(s) }));
    chipsEl.innerHTML = chips
      .map(
        (c, i) => `<div class="px-3 py-1 border border-stadium-grey font-label-sm text-label-sm text-primary flex items-center gap-2 uppercase tracking-widest">
        ${c.label} <span data-i="${i}" class="chip-clear material-symbols-outlined text-[14px] cursor-pointer hover:text-kit-accent-red">close</span>
      </div>`
      )
      .join(chips.length ? `` : "") + (chips.length ? `<button id="chip-clear-all" class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary uppercase tracking-widest ml-4 transition-colors">Clear All</button>` : "");
    chipsEl.querySelectorAll(".chip-clear").forEach((el, i) =>
      el.addEventListener("click", () => {
        chips[i].clear();
        render();
      })
    );
    document.getElementById("chip-clear-all")?.addEventListener("click", () => {
      state.league.clear();
      state.team.clear();
      state.era.clear();
      state.sizes.clear();
      render();
    });
  }

  function computeTitle() {
    if (state.team.size === 1) return Array.from(state.team)[0];
    if (state.league.size === 1) return getLeagueLabel(Array.from(state.league)[0]);
    if (state.era.size === 1) return state.era.has("vintage") ? "Vintage Archive" : "Modern Classics";
    return "The Collection";
  }

  function render() {
    renderTeamFilters();
    syncCheckboxes();
    renderChips();
    const filtered = getFiltered();
    countEl.textContent = filtered.length;
    titleEl.textContent = computeTitle();
    const visible = filtered.slice(0, state.page * state.perPage);
    gridEl.innerHTML = visible.length
      ? visible.map(productCardArtifact).join("")
      : `<div class="col-span-full py-24 text-center font-body-lg text-body-lg text-on-surface-variant">No artifacts match those filters yet — check back as the archive grows.</div>`;
    wireQuickAdd(gridEl);
    loadMoreBtn.style.display = visible.length < filtered.length ? "" : "none";
  }

  document.querySelectorAll(".league-check").forEach(cb =>
    cb.addEventListener("change", () => {
      cb.checked ? state.league.add(cb.value) : state.league.delete(cb.value);
      state.page = 1;
      render();
    })
  );
  document.addEventListener("change", e => {
    if (!e.target.classList.contains("team-check")) return;
    e.target.checked ? state.team.add(e.target.value) : state.team.delete(e.target.value);
    state.page = 1;
    render();
  });
  document.querySelectorAll(".size-btn").forEach(btn =>
    btn.addEventListener("click", () => {
      state.sizes.has(btn.dataset.size) ? state.sizes.delete(btn.dataset.size) : state.sizes.add(btn.dataset.size);
      state.page = 1;
      render();
    })
  );
  sortSelect.addEventListener("change", () => {
    state.sort = sortSelect.value;
    render();
  });
  loadMoreBtn.addEventListener("click", () => {
    state.page++;
    render();
  });
  document.getElementById("mobile-filter-toggle").addEventListener("click", () => {
    document.getElementById("mobile-filters").classList.toggle("hidden");
    document.getElementById("mobile-filters").classList.toggle("flex");
  });

  render();
});
</script>
